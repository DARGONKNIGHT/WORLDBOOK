name: Game · Offline Tests

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "scripts/build_standalone_game.py"
      - "scripts/check_changelog.py"
      - "CHANGELOG.md"
      - ".github/workflows/game-tests.yml"
  pull_request:
    paths:
      - "game/**"
      - "scripts/build_standalone_game.py"
      - "scripts/check_changelog.py"
      - "CHANGELOG.md"
      - ".github/workflows/game-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check game/engine.js
          node --check game/agent_ai.js
          node --check game/app.js
          node --check game/tests/engine.test.cjs
      - name: Run game engine regression tests
        run: node --test game/tests/*.test.cjs
      - name: Check local inference server syntax
        run: python3 -m py_compile game/agent_server.py
      - name: Verify local Ollama proxy contract
        run: python3 -m unittest discover -s game/tests -p "test_*server*.py" -v
      - name: Verify changelog newest-first order
        run: python3 scripts/check_changelog.py
      - name: Verify reproducible self-contained HTML build
        run: python3 scripts/build_standalone_game.py --check
