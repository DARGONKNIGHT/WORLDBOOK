name: Game · Windows EXE (Work directory)

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "desktop_launcher.py"
      - "scripts/build_windows_exe.py"
      - "scripts/build_standalone_game.py"
      - ".github/workflows/windows-exe.yml"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-executable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.10,<7"
      - name: Check game JavaScript
        run: |
          node --check game/engine.js
          node --check game/society.js
          node --check game/agent_ai.js
          node --check game/app.js
          node --test game/tests/engine.test.cjs game/tests/agents.test.cjs game/tests/society.test.cjs
      - name: Verify Python and changelog
        run: |
          python -m unittest discover -s game/tests -p "test_*server*.py" -v
          python scripts/check_changelog.py
          python scripts/build_standalone_game.py --check
      - name: Test EXE-local disk saves
        run: python -m unittest discover -s game/tests -p "test_desktop*.py" -v
      - name: Build Windows EXE entirely within Work
        run: python scripts/build_windows_exe.py --output Work
      - name: Check EXE and co-located assets
        run: python scripts/build_windows_exe.py --output Work --verify-layout
      - name: Smoke-test the frozen Windows EXE
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath (Resolve-Path "Work/EarthRealism.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Frozen EXE smoke test failed with exit code $($proc.ExitCode)" }
          if (-not (Test-Path "Work/logs/launcher.log")) { throw "EXE self-test did not create Work/logs/launcher.log" }
      - name: Read game release version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content "game/VERSION" -Raw).Trim()
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload Work directory (EXE plus runtime files)
        uses: actions/upload-artifact@v4
        with:
          name: EarthRealism-Windows-v${{ steps.meta.outputs.version }}-Work
          path: |
            Work/EarthRealism.exe
            Work/_internal/
            Work/README.txt
          if-no-files-found: error
          retention-days: 30
